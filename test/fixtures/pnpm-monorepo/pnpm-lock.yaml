lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    dependencies:
      react:
        specifier: ^18.2.0
        version: 18.3.1
    devDependencies:
      typescript:
        specifier: ^5.4.0
        version: 5.5.4

  packages/app:
    dependencies:
      '@babel/core':
        specifier: ^7.24.0
        version: 7.24.7
      styled-components:
        specifier: ^6.1.0
        version: 6.1.11(react-dom@18.3.1(react@18.3.1))(react@18.3.1)
      my-alias:
        specifier: npm:lodash@^4.17.0
        version: lodash@4.17.21
      local-lib:
        specifier: workspace:*
        version: link:../lib

packages:

  react@18.3.1:
    resolution: {integrity: sha512-fake}
