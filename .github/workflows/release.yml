name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Optional secrets; publish steps are skipped when they are not configured.
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from the packageManager field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - run: pnpm test

      - name: Package VSIX
        run: pnpm run package

      # Publishing to a registry is what enables auto-updates in editors.
      # Open VSX is the registry used by Cursor and VSCodium.
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: pnpm dlx ovsx publish *.vsix -p "$OVSX_PAT"

      # Optional: the Microsoft marketplace for stock VS Code users.
      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: pnpm exec vsce publish --packagePath *.vsix -p "$VSCE_PAT"

      # Manual-install fallback for anyone not using a registry.
      - name: Attach VSIX to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
          generate_release_notes: true
